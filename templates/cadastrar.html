<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar produto</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            color: #18324b;
            background: #eaf3fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 16px;
            background: linear-gradient(135deg, #eaf3fb, #d5e8f8);
        }

        main {
            width: min(100%, 560px);
            margin: 0 auto;
            padding: 32px;
            border: 1px solid #c5dced;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 12px 30px rgb(34 83 120 / 12%);
        }

        h1 {
            margin: 0 0 24px;
            color: #145a8d;
            font-size: 1.7rem;
        }

        form p {
            margin: 0 0 18px;
        }

        label {
            display: inline-block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #b8cfe1;
            border-radius: 7px;
            background: #fbfdff;
            color: #18324b;
            font: inherit;
        }

        input:focus,
        textarea:focus {
            border-color: #287db5;
            outline: 3px solid rgb(40 125 181 / 16%);
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px 16px;
            border: 0;
            border-radius: 7px;
            background: #176da5;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #105984;
        }

        [role="alert"] {
            padding: 12px;
            border: 1px solid #e6a3a3;
            border-radius: 7px;
            background: #fff2f2;
            color: #8b2424;
        }

        main > p {
            margin: 20px 0 0;
            text-align: center;
        }

        a {
            color: #145f96;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 12px;
            }

            main {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Cadastrar produto</h1>
        {% if erro %}
            <p role="alert">{{ erro }}</p>
        {% endif %}
        <form action="{{ url_for('estoque.cadastrar') }}" method="post">
            <p>
                <label for="nome">Nome</label><br>
                <input id="nome" name="nome" type="text" maxlength="100"
                       value="{{ valores.get('nome', '') }}" required>
            </p>
            <p>
                <label for="descricao">Descrição</label><br>
                <textarea id="descricao" name="descricao" rows="4">{{ valores.get('descricao', '') }}</textarea>
            </p>
            <p>
                <label for="preco">Preço</label><br>
                <input id="preco" name="preco" type="number" min="0" step="0.01"
                       value="{{ valores.get('preco', '') }}" required>
            </p>
            <p>
                <label for="quantidade">Quantidade</label><br>
                <input id="quantidade" name="quantidade" type="number" min="0" step="1"
                       value="{{ valores.get('quantidade', '') }}" required>
            </p>
            <p>
                <label for="categoria">Categoria</label><br>
                <input id="categoria" name="categoria" type="text" maxlength="50"
                       value="{{ valores.get('categoria', '') }}">
            </p>
            <button type="submit">Cadastrar produto</button>
        </form>
        <p><a href="{{ url_for('estoque.listar') }}">Ver produtos</a></p>
    </main>
</body>
</html>
